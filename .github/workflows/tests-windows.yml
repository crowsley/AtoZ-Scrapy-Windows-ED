name: Windows

permissions:
  contents: read

on:
  push:
    branches:
    - master
    - '[0-9]+.[0-9]+'
  pull_request:

concurrency:
  group: ${{github.workflow}}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: tests (${{ matrix.python-version }}, ${{ matrix.env.TOXENV }})
    runs-on: windows-latest
    env:
      PYTEST_ADDOPTS: ${{ matrix.coverage && '-n auto' || '-n auto --no-cov' }}
      # Make uv use the interpreter that actions/setup-python installed instead
      # of downloading one of its own.
      UV_PYTHON_PREFERENCE: only-system
    strategy:
      fail-fast: false
      matrix:
        include:
        - python-version: "3.10"
          env:
            TOXENV: py
        - python-version: "3.14"
          env:
            TOXENV: py
          coverage: true
        - python-version: "3.14"
          env:
            TOXENV: no-reactor

        # min deps
        - python-version: "3.10.11"
          env:
            TOXENV: min
        - python-version: "3.10.11"
          env:
            TOXENV: min-extra-deps

        - python-version: "3.14"
          env:
            TOXENV: extra-deps

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: ${{ matrix.python-version }}

    - name: Set up uv
      uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      with:
        cache-dependency-glob: |
          pyproject.toml
          tox.ini

    - name: Install mitmproxy
      env:
        # mitmproxy needs a newer Python than the oldest matrix entries, so let
        # uv download one where no system interpreter is new enough.
        UV_PYTHON_PREFERENCE: system
      run: uv tool install mitmproxy

    - name: Run tests
      env: ${{ matrix.env }}
      run: uvx --with tox-uv tox

    - name: Upload coverage report
      if: ${{ matrix.coverage }}
      uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1

    - name: Upload test results
      if: ${{ !cancelled() }}
      uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
      with:
        report_type: test_results
